version: '3.8'

services:
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: release-automation-mcp-server
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - MCP_SERVER_PORT=3001
      - DEFAULT_ENVIRONMENT=${DEFAULT_ENVIRONMENT:-Integration}
      - GIT_PLATFORM=${GIT_PLATFORM:-bitbucket}
      - AZURE_VAULT_URL=${AZURE_VAULT_URL}
    env_file:
      - ./config/.env
    volumes:
      - ./mcp-server/src:/app/src
      - ./mcp-server/dist:/app/dist
      - ./config:/app/config
    depends_on:
      - n8n
    networks:
      - release-automation
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: release-automation-dashboard
    ports:
      - "3000:3000"
    environment:
      - VITE_MCP_SERVER_URL=http://mcp-server:3001
      - VITE_WEBSOCKET_URL=ws://mcp-server:3001
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/dist:/app/dist
    depends_on:
      - mcp-server
    networks:
      - release-automation
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: release-automation-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows
    networks:
      - release-automation
    restart: unless-stopped

volumes:
  n8n_data:
    driver: local

networks:
  release-automation:
    driver: bridge
