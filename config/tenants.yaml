# Tenant Configuration for Multi-Tenant Deployment Orchestration
# Defines platform tenants and their environment-specific configurations

tenants:
  - id: tenant-a
    display_name: "Tenant A"
    description: "Primary production tenant"
    active: true
    rollback_supported: true
    environments:
      Integration:
        jenkins_job_name: "deploy-tenant-a-integration"
        jenkins_job_parameters:
          TENANT_ID: "tenant-a"
          ENVIRONMENT: "Integration"
      UAT:
        jenkins_job_name: "deploy-tenant-a-uat"
        jenkins_job_parameters:
          TENANT_ID: "tenant-a"
          ENVIRONMENT: "UAT"
      UAT1:
        jenkins_job_name: "deploy-tenant-a-uat1"
        jenkins_job_parameters:
          TENANT_ID: "tenant-a"
          ENVIRONMENT: "UAT1"
      PROD:
        jenkins_job_name: "deploy-tenant-a-prod"
        jenkins_job_parameters:
          TENANT_ID: "tenant-a"
          ENVIRONMENT: "PROD"

  - id: tenant-b
    display_name: "Tenant B"
    description: "Secondary production tenant"
    active: true
    rollback_supported: true
    environments:
      Integration:
