openapi: 3.0.3
info:
  title: Secrets Provider Abstraction Layer API
  version: 1.0.0
  description: |
    Abstraction layer interface for secrets management supporting Azure Key Vault, HashiCorp Vault, and AWS Secrets Manager.

    **Initial Implementation**: Azure Key Vault (via `@azure/keyvault-secrets`)
    **Future Support**: HashiCorp Vault (via `node-vault`), AWS Secrets Manager (via `@aws-sdk/client-secrets-manager`)

    **Design Goals**:
    - Platform-agnostic interface for MCP server credential retrieval
    - Consistent caching strategy (5-minute TTL) to reduce API calls
    - Support for secret rotation without code changes
    - Constitution compliance (no credentials in logs, quarterly rotation)

    **Security Requirements**:
    - All secrets retrieved server-side only (NEVER exposed to AI clients)
    - Secrets sanitized in logs (***REDACTED*** placeholder)
    - Provider authentication via managed identities (Azure) or instance roles (AWS)
    - Secrets encrypted at rest and in transit

    **Authentication**: Azure Managed Identity (initial), HashiCorp AppRole (future), AWS IAM (future)
    **Rate Limiting**: Respects provider limits with exponential backoff retry (3 attempts: 1s, 2s, 4s)
    **Timeouts**: 10s for reads, 30s for writes
    **Caching**: In-memory cache with 5-minute TTL per secret

  contact:
    name: Release Automation Team
    email: release-team@example.com

servers:
  - url: https://{vaultName}.vault.azure.net
    description: Azure Key Vault (initial implementation)
    variables:
      vaultName:
        default: release-automation-vault
        description: Azure Key Vault instance name
  - url: https://vault.example.com:8200
    description: HashiCorp Vault (future support)
  - url: https://secretsmanager.us-east-1.amazonaws.com
    description: AWS Secrets Manager (future support)

tags:
  - name: Secrets
    description: Secret retrieval and management operations
  - name: Rotation
    description: Secret rotation and versioning

paths:
  /secrets/{secretName}:
    get:
      tags:
        - Secrets
      operationId: getSecret
      summary: Retrieve secret value by name
      description: |
        Retrieves a secret value from the secrets provider with caching.

        **Caching Strategy** (from research.md SecretsManager):
        - In-memory cache with 5-minute TTL per secret
        - Reduces API calls to secrets provider
        - Cache invalidated on rotation or manual flush

        **Use Case**: MCP server retrieves credentials at startup or on-demand for external integrations.
        **Security**: Value NEVER logged or returned to AI clients (used server-side only).

        **Required Secrets** (from research.md):
        - `BITBUCKET_USERNAME` / `BITBUCKET_APP_PASSWORD`
        - `JENKINS_URL` / `JENKINS_API_TOKEN`
        - `JIRA_EMAIL` / `JIRA_API_TOKEN`
        - `TEAMS_WEBHOOK_URL` (or Graph API credentials)
        - `AZURE_VAULT_URL` (environment variable, not in vault)

      parameters:
        - name: secretName
          in: path
          required: true
          schema:
            type: string
          description: Secret name/identifier (e.g., "BITBUCKET_APP_PASSWORD")
          example: "JENKINS_API_TOKEN"

      responses:
        '200':
          description: Secret retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretValue'
              example:
                name: "JENKINS_API_TOKEN"
                value: "***REDACTED***"
                version: "2"
                createdAt: "2025-10-01T10:00:00Z"
                expiresAt: "2026-01-01T00:00:00Z"
                rotationDue: false

        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "SECRET_NOT_FOUND"
                message: "Secret 'JENKINS_API_TOKEN' does not exist in vault"
                retryable: false

        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "AUTH_FAILED"
                message: "Managed identity authentication failed. Verify Azure AD permissions."
                retryable: false

        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "PERMISSION_DENIED"
                message: "Service principal lacks 'Get' permission on secret 'JENKINS_API_TOKEN'"
                retryable: false

        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "RATE_LIMIT_EXCEEDED"
                message: "Azure Key Vault rate limit exceeded. Retry after 30 seconds."
                retryable: true
                retryAfterSeconds: 30

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INTERNAL_ERROR"
                message: "Secrets provider API returned 500: Internal Server Error"
                retryable: true

  /secrets:
    get:
      tags:
        - Secrets
      operationId: listSecrets
      summary: List all secret names
      description: |
        Retrieves list of all secret names (identifiers) in the vault without values.

        **Use Case**: Auditing, validation of required secrets at startup, rotation management.
        **Security**: Returns only names (no values), sorted alphabetically.
        **Performance**: Cached for 10 minutes (secrets rarely added/removed).

      responses:
        '200':
          description: Secret names retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  secrets:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Secret name
                        version:
                          type: string
                          description: Current version number
                        expiresAt:
                          type: string
                          format: date-time
                          description: Expiration timestamp (ISO 8601, UTC)
                        rotationDue:
                          type: boolean
                          description: Whether rotation is due (expires within 30 days)
              example:
                secrets:
                  - name: "BITBUCKET_APP_PASSWORD"
                    version: "3"
                    expiresAt: "2025-12-31T00:00:00Z"
                    rotationDue: false
                  - name: "JENKINS_API_TOKEN"
                    version: "2"
                    expiresAt: "2026-01-01T00:00:00Z"
                    rotationDue: false
                  - name: "JIRA_API_TOKEN"
                    version: "1"
                    expiresAt: "2025-11-15T00:00:00Z"
                    rotationDue: true

        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /secrets/{secretName}/rotate:
    post:
      tags:
        - Rotation
      operationId: rotateSecret
      summary: Rotate secret with new value
      description: |
        Creates a new version of a secret with updated value.

        **Rotation Workflow** (from research.md best practices):
        1. Add new version with `rotateSecret(name, newValue)`
        2. Update application references to use new version
        3. Delete old version after grace period (24 hours)

        **Use Case**: Quarterly credential rotation (Constitution requirement), security incident response.
        **Cache Invalidation**: Clears cached value for this secret (forces refresh on next `getSecret`).
        **Versioning**: Provider maintains version history (Azure: automatic, HashiCorp: manual).

      parameters:
        - name: secretName
          in: path
          required: true
          schema:
            type: string
          description: Secret name to rotate
          example: "JENKINS_API_TOKEN"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newValue
              properties:
                newValue:
                  type: string
                  description: New secret value (encrypted in transit)
                  example: "new-jenkins-token-xyz789"
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional expiration timestamp (ISO 8601, UTC)
                  example: "2026-04-01T00:00:00Z"

      responses:
        '200':
          description: Secret rotated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                    description: New version number
                  previousVersion:
                    type: string
                    description: Previous version number (available for rollback)
                  rotatedAt:
                    type: string
                    format: date-time
                    description: Rotation timestamp (ISO 8601, UTC)
                  expiresAt:
                    type: string
                    format: date-time
                    description: Expiration timestamp (ISO 8601, UTC)
              example:
                name: "JENKINS_API_TOKEN"
                version: "3"
                previousVersion: "2"
                rotatedAt: "2025-10-19T14:45:00Z"
                expiresAt: "2026-04-01T00:00:00Z"

        '400':
          description: Invalid rotation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "INVALID_SECRET_VALUE"
                message: "Secret value cannot be empty or exceed 25KB"
                retryable: false

        '404':
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    SecretValue:
      type: object
      description: Secret value with metadata (from research.md ISecretsProvider interface)
      required:
        - name
        - value
        - version
        - createdAt
      properties:
        name:
          type: string
          description: Secret name/identifier
          example: "JENKINS_API_TOKEN"
        value:
          type: string
          description: |
            Secret value (REDACTED in logs, NEVER exposed to AI clients).
            **Note**: In API responses to MCP server, this contains actual value.
            In logs, this is replaced with "***REDACTED***".
          example: "***REDACTED***"
        version:
          type: string
          description: Current version number (Azure: auto-generated GUID, HashiCorp: integer)
          example: "2"
        createdAt:
          type: string
          format: date-time
          description: Secret creation timestamp (ISO 8601, UTC)
          example: "2025-10-01T10:00:00Z"
        expiresAt:
          type: string
          format: date-time
          description: Expiration timestamp (ISO 8601, UTC). Null if no expiration set.
          example: "2026-01-01T00:00:00Z"
        rotationDue:
          type: boolean
          description: Whether rotation is due (expires within 30 days or past expiration)
          example: false

    Error:
      type: object
      description: Structured error response for all error scenarios
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
          description: Machine-readable error code
          example: "SECRET_NOT_FOUND"
        message:
          type: string
          description: Human-readable error description
          example: "Secret 'JENKINS_API_TOKEN' does not exist in vault"
        retryable:
          type: boolean
          description: Whether this error is transient and can be retried
          example: false
        retryAfterSeconds:
          type: integer
          description: Seconds to wait before retry (for rate limits)
          example: 30
        diagnosticContext:
          type: object
          description: Additional debugging information (sanitized, no credentials)
          additionalProperties: true
          example:
            provider: "azure-keyvault"
            vaultUrl: "https://release-automation-vault.vault.azure.net"
            statusCode: 404

  securitySchemes:
    AzureManagedIdentity:
      type: http
      scheme: bearer
      description: |
        Azure Managed Identity authentication (initial implementation).
        Token automatically obtained via Azure Instance Metadata Service (IMDS).
        No credentials required in code.
    HashiCorpAppRole:
      type: apiKey
      in: header
      name: X-Vault-Token
      description: |
        HashiCorp Vault AppRole authentication (future support).
        Token obtained via AppRole login with role_id + secret_id.
    AWSInstanceRole:
      type: http
      scheme: bearer
      description: |
        AWS IAM instance role authentication (future support).
        Credentials automatically obtained via EC2 Instance Metadata Service.

security:
  - AzureManagedIdentity: []
  - HashiCorpAppRole: []
  - AWSInstanceRole: []
